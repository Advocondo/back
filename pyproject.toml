[project]
name = "advocondo"
version = "0.1.0"
description = "Backend do Advocondo, sistema de gestão de contratos para escritórios de advocacia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sentry-sdk[fastapi]>=2.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocondo"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=advocondo --cov-report=term-missing --strict-markers"
markers = [
    "integration: usa o banco de dados de teste (marcado automaticamente)",
]

[tool.coverage.run]
branch = true
source = ["advocondo"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Arquitetura MVC + Camadas: cada camada só importa as de baixo.
# Ver https://advocondo.github.io/docs/arquitetura/ . Todo novo domínio entra
# em `containers` (e na lista do contrato de independência do HTTP).
[tool.importlinter]
root_package = "advocondo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas de cada domínio"
type = "layers"
containers = ["advocondo.condominios"]
layers = [
    "router",
    "service",
    "repository | schemas",
    "models",
    "domain | exceptions",
]

[[tool.importlinter.contracts]]
name = "O router não pula o service (sem acesso direto ao repository)"
type = "forbidden"
source_modules = ["advocondo.condominios.router"]
forbidden_modules = ["advocondo.condominios.repository"]
allow_indirect_imports = true  # via service é o caminho certo

[[tool.importlinter.contracts]]
name = "Só o router conhece HTTP (FastAPI)"
type = "forbidden"
source_modules = [
    "advocondo.condominios.service",
    "advocondo.condominios.repository",
    "advocondo.condominios.schemas",
    "advocondo.condominios.models",
    "advocondo.condominios.domain",
    "advocondo.condominios.exceptions",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Regras de domínio são puras (sem banco, sem HTTP, sem Pydantic)"
type = "forbidden"
source_modules = ["advocondo.condominios.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "pydantic"]
