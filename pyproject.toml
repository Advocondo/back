[project]
name = "advocondo"
version = "0.1.0"
description = "Backend do Advocondo, sistema de gestão de contratos para escritórios de advocacia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sentry-sdk[fastapi]>=2.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocondo"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.2",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--cov=advocondo --cov-report=term-missing --strict-markers"
markers = [
    "integration: usa o banco de dados de teste (marcado automaticamente)",
]

[tool.coverage.run]
branch = true
source = ["advocondo"]
omit = ["*/test_*.py"]

[tool.mypy]
strict = true
files = ["src", "tests"]
