[project]
name = "advocondo"
version = "0.1.0"
description = "Backend do Advocondo, sistema de gestão de contratos para escritórios de advocacia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocondo"]

[dependency-groups]
dev = [
    "ruff>=0.6.2",
]
