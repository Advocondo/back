services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-advocondo}:${POSTGRES_PASSWORD:-advocondo}@db:5432/${POSTGRES_DB:-advocondo}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-advocondo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advocondo}
      POSTGRES_DB: ${POSTGRES_DB:-advocondo}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-advocondo} -d ${POSTGRES_DB:-advocondo}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  uv-cache:
