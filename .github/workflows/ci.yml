name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint e testes
    runs-on: ubuntu-latest
    # Banco usado só pelos testes de integração; descartado ao fim do job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: advocondo
          POSTGRES_PASSWORD: advocondo
          POSTGRES_DB: advocondo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advocondo -d advocondo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://advocondo:advocondo@localhost:5432/advocondo_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o gitleaks

      # Falha se algum commit tiver algo que pareça um segredo. Ver docs/segredos.md.
      - name: Segredos (gitleaks)
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (ruff)
        run: uv run ruff format --check .

      - name: Checagem de tipos (mypy)
        run: uv run mypy

      - name: Testes com cobertura (pytest)
        run: uv run pytest --cov-report=xml

      - name: Resumo da cobertura
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build da imagem de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Mesma imagem que o Coolify constrói no deploy; não é publicada.
      - name: Build do Dockerfile.prod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
